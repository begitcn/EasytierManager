name: EasyTierManager
options:
  bundleIdPrefix: com.easytier
  deploymentTarget:
    macOS: "13.0"
  objectVersion: "57"

settings:
  base:
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  EasyTierManager:
    type: application
    platform: macOS
    sources:
      - path: Sources/EasyTierManager
      - path: Resources/Assets.xcassets
    dependencies:
      - target: EasyTierHelperShared
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.easytier.manager
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist
      properties:
        CFBundleIconName: AppIcon
    entitlements:
      path: Resources/Signing.entitlements
    postCompileScripts:
      - name: "Embed EasyTier Helpers"
        script: |
          SRC="${SRCROOT}/Helpers"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          if [ -f "$SRC/easytier-core" ] && [ -f "$SRC/easytier-cli" ]; then
            mkdir -p "$DST"
            cp "$SRC/easytier-core" "$SRC/easytier-cli" "$DST/"
            chmod +x "$DST/easytier-core" "$DST/easytier-cli"
          fi
        basedOnDependencyAnalysis: false
      - name: "Build & Embed Privileged Helper"
        script: |
          HELPER_BIN=""
          if [ -f "${BUILT_PRODUCTS_DIR}/EasyTierHelper" ]; then
            HELPER_BIN="${BUILT_PRODUCTS_DIR}/EasyTierHelper"
          elif [ -f "${SRCROOT}/.build/debug/EasyTierHelper" ]; then
            HELPER_BIN="${SRCROOT}/.build/debug/EasyTierHelper"
          elif [ -f "${SRCROOT}/.build/release/EasyTierHelper" ]; then
            HELPER_BIN="${SRCROOT}/.build/release/EasyTierHelper"
          fi

          HELPER_PLIST_SRC="${SRCROOT}/Resources/EasyTierHelper.plist"
          HELPER_TOOLS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/HelperTools"
          HELPER_DAEMONS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"

          if [ -f "$HELPER_BIN" ]; then
            mkdir -p "$HELPER_TOOLS_DIR"
            cp "$HELPER_BIN" "$HELPER_TOOLS_DIR/EasyTierHelper"
            chmod +x "$HELPER_TOOLS_DIR/EasyTierHelper"

            mkdir -p "$HELPER_DAEMONS_DIR"
            cp "$HELPER_PLIST_SRC" "$HELPER_DAEMONS_DIR/"
            echo "Helper embedded from $HELPER_BIN"
          else
            echo "warning: EasyTierHelper binary not found. Run 'swift build' first."
          fi
        basedOnDependencyAnalysis: false

  EasyTierHelperShared:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/EasyTierHelperShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easytier.manager.helpershared
        CODE_SIGN_IDENTITY: "-"

  EasyTierHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/EasyTierHelper
    dependencies:
      - target: EasyTierHelperShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easytier.manager.helper
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: "YES"