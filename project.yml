name: EasyTierManager
options:
  bundleIdPrefix: com.easytier
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  EasyTierManager:
    type: application
    platform: macOS
    sources:
      - path: Sources/EasyTierManager
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.easytier.manager
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist
      properties:
        CFBundleIconName: AppIcon
    entitlements:
      path: Resources/Signing.entitlements
    postCompileScripts:
      - name: "Embed EasyTier Helpers"
        script: |
          SRC="${SRCROOT}/Helpers"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          if [ -f "$SRC/easytier-core" ] && [ -f "$SRC/easytier-cli" ]; then
            mkdir -p "$DST"
            cp "$SRC/easytier-core" "$SRC/easytier-cli" "$DST/"
            chmod +x "$DST/easytier-core" "$DST/easytier-cli"
          fi
        basedOnDependencyAnalysis: false

